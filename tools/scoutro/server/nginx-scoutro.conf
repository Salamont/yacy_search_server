# Scoutro reverse proxy for server operation (not for Olares).
# See docs/SERVER_AGENT_ACCESS.md. Replace the listen addresses and the
# certificate paths; YaCy listens on 127.0.0.1:8090 (yacy-agent-server.conf).

# --- agent listener: only the agent API ---------------------------------------
# Agents get only this address. It forwards nothing but /scoutro/api/agent/v1/
# (every agent call needs a Bearer agent token, checked by Scoutro) and the
# public API descriptions; every other path answers 404 here.
server {
    listen 192.0.2.2:8095;                     # e.g. an internal interface for agents
    # listen 192.0.2.2:8445 ssl;               # with TLS:
    # ssl_certificate     /etc/ssl/scoutro-agents.crt;
    # ssl_certificate_key /etc/ssl/scoutro-agents.key;
    server_name _;

    client_max_body_size 32k;                  # the API accepts at most 16 KiB
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;   # trusted by YaCy for 127.0.0.1 (rate limits per client)
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 120s;
    proxy_redirect off;

    # nginx matches the normalized URI (dot segments and %2e resolved) and,
    # because proxy_pass names the target path, forwards that normalized URI;
    # a raw path that only YaCy would resolve differently never reaches it.
    location /scoutro/api/agent/v1/ {
        limit_except GET POST PATCH { deny all; }
        proxy_pass http://127.0.0.1:8090/scoutro/api/agent/v1/;
    }
    location = /scoutro/api/actions.json {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8090/scoutro/api/actions.json;
    }
    location = /scoutro/api/openapi.json {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8090/scoutro/api/openapi.json;
    }
    location / {
        return 404;
    }
}

# --- people listener (optional): web interface, search, admin API --------------
# For the administrator and, if wanted, the public search. Never give agents
# this address: with publicSearchpage=true it answers searches over the whole
# index without login, and the native AI/MCP endpoints are behind it.
server {
    listen 127.0.0.1:8080;                     # e.g. a VPN/LAN interface, or TLS on 443
    server_name _;
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 300s;
    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
