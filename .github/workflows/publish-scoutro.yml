name: Publish Scoutro image

# Builds the Scoutro container image from docker/Dockerfile.scoutro and pushes
# it to GHCR, so the Olares package (Salamont/YaCy-Search-Community) can pin an
# immutable digest. Runs natively on linux/amd64; no QEMU, no personal tokens.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-scoutro.yml
      - docker/Dockerfile.scoutro
      - docker/Dockerfile.scoutro.dockerignore
      - scoutro.properties
      - tools/scoutro/**

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-scoutro-image
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to overwrite existing release tags
        run: |
          python3 - <<'PY'
          import json, urllib.error, urllib.request
          registry = "https://ghcr.io"
          repository = "salamont/scoutro"
          with urllib.request.urlopen(registry + "/token?service=ghcr.io&scope=repository:" + repository + ":pull") as response:
              token = json.load(response)["token"]
          headers = {"Authorization": "Bearer " + token,
                     "Accept": "application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"}
          for tag in ("1.942-scoutro.10", "0.5.10"):
              request = urllib.request.Request(registry + "/v2/" + repository + "/manifests/" + tag, headers=headers)
              try:
                  with urllib.request.urlopen(request):
                      pass
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  errors = json.load(error).get("errors", [])
                  if not any(item.get("code") == "MANIFEST_UNKNOWN" for item in errors):
                      raise
                  print("New release tag available:", tag)
              else:
                  raise SystemExit("Refusing to overwrite existing release tag: " + tag)
          PY

      # Offline tests of the Scoutro tools shipped in the image (stdlib only).
      - name: Test scoutro-discovery / scoutro_classify
        run: |
          python3 tools/scoutro/scoutro-discovery selftest
          python3 test/scoutro-discovery/test_discovery.py
          python3 test/scoutro-discovery/test_state_multiprofile.py

      # BuildKit may use <Dockerfile>.dockerignore automatically; copy it over
      # the root .dockerignore as well so the Scoutro build context keeps
      # test/jetty regardless of the BuildKit version.
      - name: Use the Scoutro build-context ignore rules
        run: cp docker/Dockerfile.scoutro.dockerignore .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.scoutro
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/salamont/scoutro:1.942-scoutro.10
            ghcr.io/salamont/scoutro:0.5.10
          build-args: |
            SCOUTRO_VERSION=1.942-scoutro.10
            SCOUTRO_REVISION=${{ github.sha }}

      - name: Report published digest
        run: |
          echo "### Scoutro image published" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect ghcr.io/salamont/scoutro:1.942-scoutro.10 | tee /tmp/inspect.txt
          {
            echo '```'
            cat /tmp/inspect.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
