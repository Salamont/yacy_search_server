# Scoutro release information (GPL-2.0-or-later).
# Scoutro is an independent community project based on YaCy.
#
# The YaCy version itself stays in build.properties (releaseVersion) and must
# remain numeric (e.g. 1.942): YaCy parses it as a number for peer-to-peer
# version handling and updates. The Scoutro release is tracked here.
#
# Full Scoutro version = <scoutro.upstream.version>-scoutro.<scoutro.release>
# e.g. 1.942-scoutro.1 (git tag v1.942-scoutro.1, image tag 1.942-scoutro.1)

scoutro.release=3
scoutro.upstream.version=1.942
scoutro.upstream.repository=https://github.com/yacy/yacy_search_server
scoutro.upstream.branch=master
scoutro.upstream.commit=b50b76bd552a851f737b98683f20d8b861e137ae
