# Scoutro website technologies (R5): public technical markers of a page, never its running text.
# key: <technology>_<element> (technology without '_'), value: a Java regular expression that must match the whole
# element content; a named group (?<at>...) marks where the evidence excerpt starts. Elements: see
# net.yacy.document.parser.html.Evaluation.Element. The rule version below goes with every match into the index field
# website_technology_sxt; change it with every change of a rule. Extend: docs/SCOUTRO_WEBSITE_TECHNOLOGY.md.
version=1

wordpress_metagenerator=(?i)\\s*(?<at>WordPress)(?:\\s.*)?
wordpress_scriptpath=(?i).*(?<at>/wp-(?:content|includes)/).*
wordpress_csspath=(?i).*(?<at>/wp-(?:content|includes)/).*

elementor_metagenerator=(?i)\\s*(?<at>Elementor)\\s.*
elementor_scriptpath=(?i).*(?<at>/wp-content/plugins/elementor/).*
elementor_csspath=(?i).*(?<at>/wp-content/(?:plugins/elementor/|uploads/elementor/css/)).*

elementor-pro_scriptpath=(?i).*(?<at>/wp-content/plugins/elementor-pro/).*
elementor-pro_csspath=(?i).*(?<at>/wp-content/plugins/elementor-pro/).*

yoast-seo_comment=(?is).*(?<at>optimized with the Yoast SEO).*
yoast-seo_scriptpath=(?i).*(?<at>/wp-content/plugins/wordpress-seo(?:-premium)?/).*
yoast-seo-premium_comment=(?is).*(?<at>optimized with the Yoast SEO Premium plugin).*
yoast-seo-premium_scriptpath=(?i).*(?<at>/wp-content/plugins/wordpress-seo-premium/).*

wp-rocket_comment=(?is).*(?<at>(?:Performance )?optimized by WP Rocket|https?://wp-rocket\\.me).*
wp-rocket_scriptpath=(?i).*(?<at>/wp-content/(?:plugins/wp-rocket/|cache/wp-rocket/)).*
wp-rocket_csspath=(?i).*(?<at>/wp-content/cache/wp-rocket/).*
wp-rocket_scriptcode=(?s).*(?<at>RocketLazyLoadScripts|RocketPreloadLinksConfig).*

google-tag-manager_scriptpath=(?i).*(?<at>googletagmanager\\.com/gtm\\.js).*
google-tag-manager_scriptcode=(?s).*(?<at>googletagmanager\\.com/gtm\\.js|['"]gtm\\.start['"]).*
google-tag-manager_iframepath=(?i).*(?<at>googletagmanager\\.com/ns\\.html).*

google-analytics_scriptpath=(?i).*(?<at>googletagmanager\\.com/gtag/js\\?id=(?:G|UA)-|google-analytics\\.com/(?:analytics|ga)\\.js).*
google-analytics_scriptcode=(?s).*(?<at>gtag\\(\\s*['"]config['"]\\s*,\\s*['"](?:G|UA)-|google-analytics\\.com/(?:analytics|ga)\\.js).*

pardot_scriptpath=(?i).*(?<at>(?:pi|go|cdn)\\.pardot\\.com/).*
pardot_scriptcode=(?s).*(?<at>\\bpiAId\\s*=|(?:pi|go|cdn)\\.pardot\\.com).*
pardot_iframepath=(?i).*(?<at>(?:pi|go)\\.pardot\\.com/).*
